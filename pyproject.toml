[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "priority-auditing-supplement"
version = "0.1.0"
description = "Finite-population, priority-aware categorical auditing experiments"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "seaborn>=0.13",
  "threadpoolctl>=3.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["auditcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
